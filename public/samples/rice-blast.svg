<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#132A1E"/>
  <!-- Rice leaf (elongated) -->
  <path d="M100 25 C85 40, 55 80, 55 120 C55 150, 75 170, 100 175 C125 170, 145 150, 145 120 C145 80, 115 40, 100 25Z" fill="#4ADE80" opacity="0.8"/>
  <!-- Central vein -->
  <path d="M100 30 L100 170" stroke="#166534" stroke-width="2.5" fill="none"/>
  <!-- Parallel veins -->
  <path d="M80 50 L80 160" stroke="#22863A" stroke-width="0.8" fill="none" opacity="0.5"/>
  <path d="M120 50 L120 160" stroke="#22863A" stroke-width="0.8" fill="none" opacity="0.5"/>
  <!-- Diamond-shaped blast lesions -->
  <polygon points="85,70 100,60 115,70 100,80" fill="#9CA3AF" stroke="#D1D5DB" stroke-width="1" opacity="0.9"/>
  <polygon points="75,100 90,88 105,100 90,112" fill="#9CA3AF" stroke="#D1D5DB" stroke-width="1" opacity="0.85"/>
  <polygon points="95,130 110,118 125,130 110,142" fill="#6B7280" stroke="#9CA3AF" stroke-width="1" opacity="0.8"/>
  <polygon points="80,145 92,137 104,145 92,153" fill="#9CA3AF" stroke="#D1D5DB" stroke-width="1" opacity="0.75"/>
  <!-- Dark centers -->
  <circle cx="100" cy="70" r="3" fill="#374151" opacity="0.9"/>
  <circle cx="90" cy="100" r="3" fill="#374151" opacity="0.85"/>
  <circle cx="110" cy="130" r="3" fill="#374151" opacity="0.8"/>
  <!-- Label -->
  <text x="100" y="193" text-anchor="middle" fill="#FBBF24" font-family="sans-serif" font-size="11" font-weight="bold">Rice Blast</text>
</svg>
